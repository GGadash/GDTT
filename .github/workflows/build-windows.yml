name: Build Windows package

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: PyInstaller onedir / Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Build and verify portable package
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Bootstrap verified NSIS compiler
        shell: pwsh
        run: ./scripts/bootstrap_nsis.ps1

      - name: Build and verify current-user installer
        shell: pwsh
        run: ./scripts/build_installer.ps1

      - name: Build audited source archive
        shell: pwsh
        run: ./scripts/build_source_archive.ps1

      - name: Run local C-lite release acceptance
        shell: pwsh
        run: ./scripts/verify_c_lite.ps1

      - name: Finalize release metadata and checksums
        shell: pwsh
        run: ./scripts/finalize_release_candidate.ps1

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v7
        with:
          name: GDTT-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            packaging/output/GDTT-*-windows-x64-Portable.zip
            packaging/output/GDTT-*-windows-x64-installer.exe
            packaging/output/GDTT-*-source.zip
            packaging/output/BUILD_MANIFEST.json
            packaging/output/LOCAL_C_LITE.json
            packaging/output/RELEASE_CANDIDATE.md
            packaging/output/SHA256SUMS.txt
            packaging/output/VERIFY_CHECKSUMS.ps1

  release:
    name: Publish tagged GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v7
        with:
          name: GDTT-windows-x64
          path: release-assets

      - name: Validate tag and release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $tag = $env:GITHUB_REF_NAME
          $tagMatch = [regex]::Match(
            $tag,
            '^v(?<version>\d+\.\d+\.\d+)(?<suffix>-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          )
          if (-not $tagMatch.Success) {
            throw "Release tags must use vMAJOR.MINOR.PATCH or a hyphenated pre-release suffix: $tag"
          }

          $assetRoot = [IO.Path]::GetFullPath("release-assets")
          $manifestPath = Join-Path $assetRoot "BUILD_MANIFEST.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $tagVersion = $tagMatch.Groups["version"].Value
          if ([string]$manifest.version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match built GDTT version $($manifest.version)."
          }
          if ($manifest.archive.name -cne "GDTT-$tagVersion-windows-x64-Portable.zip" -or
              $manifest.installer.name -cne "GDTT-$tagVersion-windows-x64-installer.exe") {
            throw "Release filenames must explicitly identify Portable and installer artifacts."
          }

          $requiredNames = @(
            [string]$manifest.archive.name,
            [string]$manifest.installer.name,
            [string]$manifest.sourceArchive.name,
            "BUILD_MANIFEST.json",
            "LOCAL_C_LITE.json",
            "RELEASE_CANDIDATE.md",
            "SHA256SUMS.txt",
            "VERIFY_CHECKSUMS.ps1"
          )
          if (($requiredNames | Sort-Object -Unique).Count -ne $requiredNames.Count) {
            throw "The release asset list contains duplicate names."
          }
          foreach ($name in $requiredNames) {
            if ([IO.Path]::GetFileName($name) -ne $name) {
              throw "Release asset names must be flat file names: $name"
            }
            $path = Join-Path $assetRoot $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release asset is missing: $name"
            }
          }

          & (Join-Path $assetRoot "VERIFY_CHECKSUMS.ps1") -Directory $assetRoot

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $tag = $env:GITHUB_REF_NAME
          & gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving its published assets unchanged."
            exit 0
          }

          $manifest = Get-Content -LiteralPath "release-assets/BUILD_MANIFEST.json" -Raw | ConvertFrom-Json
          $assetNames = @(
            [string]$manifest.archive.name,
            [string]$manifest.installer.name,
            [string]$manifest.sourceArchive.name,
            "BUILD_MANIFEST.json",
            "LOCAL_C_LITE.json",
            "RELEASE_CANDIDATE.md",
            "SHA256SUMS.txt",
            "VERIFY_CHECKSUMS.ps1"
          )
          $assets = @($assetNames | ForEach-Object { Join-Path "release-assets" $_ })
          $notes = @"
          Windows x64 assets were built and verified by GitHub Actions from the tagged commit.

          Review the attached RELEASE_CANDIDATE.md for acceptance status and limitations. Verify
          downloaded files with SHA256SUMS.txt and VERIFY_CHECKSUMS.ps1. The Windows executable
          and installer are unsigned unless BUILD_MANIFEST.json states otherwise.
          "@
          $arguments = @(
            "release", "create", $tag
          ) + $assets + @(
            "--repo", $env:GH_REPO,
            "--verify-tag",
            "--title", "GDTT $tag",
            "--generate-notes",
            "--notes", $notes
          )
          if ($tag.Contains("-")) {
            $arguments += @("--prerelease", "--latest=false")
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed for $tag."
          }
