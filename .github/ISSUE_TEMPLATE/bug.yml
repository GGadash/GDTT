name: Bug report
description: Report reproducible incorrect behavior in GDTT
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach confidential monitoring datasets. Use a sanitized sample where possible."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List exact steps and safe sample values.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "0.10.1 (release tag v0.10.1-rc.1)"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Safe diagnostics
      description: Warnings, error details, and environment information without private data.
